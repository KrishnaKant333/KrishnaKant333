<svg width="1200" height="180" viewBox="0 0 1200 180"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="footerGradient">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#BD93F9"/>
    </linearGradient>

    <linearGradient id="footerBg">
      <stop offset="0%" stop-color="#080B1A"/>
      <stop offset="100%" stop-color="#1B1033"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="180" rx="18" fill="url(#footerBg)"/>

  <!-- Animated wave lines -->
  <path d="M0 90 Q150 20 300 90 T600 90 T900 90 T1200 90"
        fill="none"
        stroke="#00E5FF"
        stroke-width="2"
        opacity="0.7">
    <animate attributeName="d"
             values="
             M0 90 Q150 20 300 90 T600 90 T900 90 T1200 90;
             M0 90 Q150 160 300 90 T600 90 T900 90 T1200 90;
             M0 90 Q150 20 300 90 T600 90 T900 90 T1200 90"
             dur="8s"
             repeatCount="indefinite"/>
  </path>

  <path d="M0 105 Q150 35 300 105 T600 105 T900 105 T1200 105"
        fill="none"
        stroke="#BD93F9"
        stroke-width="1"
        opacity="0.5">
    <animate attributeName="stroke-dashoffset"
             from="0"
             to="-300"
             dur="6s"
             repeatCount="indefinite"/>
  </path>

  <!-- Footer text -->
  <text x="600" y="78"
        text-anchor="middle"
        font-family="monospace"
        font-size="24"
        font-weight="bold"
        fill="url(#footerGradient)">
    KEEP BUILDING. KEEP EXPLORING.
  </text>

  <text x="600" y="115"
        text-anchor="middle"
        font-family="monospace"
        font-size="14"
        fill="#D6D6F5">
    Crafted with curiosity and code
  </text>

  <!-- Animated dots -->
  <g fill="#00E5FF">
    <circle cx="460" cy="145" r="3">
      <animate attributeName="opacity"
               values="0.2;1;0.2"
               dur="2s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="600" cy="145" r="3">
      <animate attributeName="opacity"
               values="1;0.2;1"
               dur="2s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="740" cy="145" r="3">
      <animate attributeName="opacity"
               values="0.2;1;0.2"
               dur="2s"
               repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="178"
        rx="18"
        fill="none"
        stroke="#BD93F9"
        stroke-opacity="0.5"/>
</svg>
